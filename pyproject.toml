[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cayley"
version = "0.1.0"
description = "Neural distance heuristic + GPU beam search for the Kaggle IHES Picture Cube competition"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
torch = ["torch"]
cayleypy = ["cayleypy"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
