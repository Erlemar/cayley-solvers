# Stage 3 continuation -- small trunk, warm from c_bells/epoch_0124.pt.
#
# Measured 2026-07-23: Bellman quality improves monotonically with epochs on this
# puzzle, even though V's absolute scale collapses (V@80: 26.3 @ep24 -> 16.8
# @ep124). The collapse is a benign monotone compression -- ep124 beat ep24 at
# every scramble depth (19/24 vs 17/24 solved, mean length 54 vs 61), because
# what beam needs is ordering quality, and ep124's discrimination-to-noise ratio
# is higher (3.49 vs 3.18). So: keep training.
#
# The original run was stopped at ep124 on a wrong hypothesis; this continues it.

model:
  state_size: 96
  num_classes: 6
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: onehot

training:
  n_epochs: 400
  samples_per_epoch: 500_000
  batch_size: 16384
  k_max: 60
  lr: 3.0e-4              # lower than the 5e-4 first leg: this is a continuation
  weight_decay: 0.0
  checkpoint_every_epochs: 50
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "cube444/models/c_bells/epoch_0124.pt"
  target_update_every_epochs: 10
  target_net_chunk: 8192
  clip_upper: true
  clip_lower: true
  bfs_d6_path: "cube444/data/bfs_anchors.pt"
  bfs_d6_fraction: 0.10
  n_anchor_v0: 32
  n_anchor_d1: 4
  lambda_pdb: 0.0
  frontier_fraction: 0.0

seed: 445
