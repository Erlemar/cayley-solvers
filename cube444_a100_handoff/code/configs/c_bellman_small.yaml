# Stage 3 -- Bellman refinement of the SMALL (3.30M) trunk.
# Identical recipe to c_bellman.yaml; only the trunk shape and warmstart differ.
# See c_v0s_pretrain.yaml for why the small variant exists (width beats depth
# when the score is inference-bound).

model:
  state_size: 96
  num_classes: 6
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: onehot

training:
  n_epochs: 300
  samples_per_epoch: 500_000
  batch_size: 16384
  k_max: 60
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 25
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "cube444/models/c_v0s/epoch_0999.pt"
  target_update_every_epochs: 10
  target_net_chunk: 8192
  clip_upper: true
  clip_lower: true
  bfs_d6_path: "cube444/data/bfs_anchors.pt"
  bfs_d6_fraction: 0.10
  n_anchor_v0: 32
  n_anchor_d1: 4
  lambda_pdb: 0.0
  frontier_fraction: 0.0

seed: 444
