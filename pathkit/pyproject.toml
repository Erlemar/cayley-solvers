[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathkit"
version = "1.0.0"
description = "Path post-processing for Cayley-graph puzzles: merge, window rewriting, bridging, exact ladders"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
gpu = ["torch"]
dev = ["pytest", "ruff"]

[project.scripts]
pathkit = "pathkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathkit*"]

[tool.ruff]
line-length = 100
target-version = "py310"
