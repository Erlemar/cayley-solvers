# m_adm_v0 = m_curr_v3 recipe + admissibility-aware loss term.
#
# loss = bellman + lambda_upper * relu(pred - walk_depth)^2
#                + lambda_pdb   * relu(h_PDB - pred)^2
#
# h_PDB = max-of-4 disjoint K=5 corner PDB lookups (admissible lower bound on d(s)).
# Goal: fix V_full(V0) ≈ 0.91 undershoot. PDB(V0)=0 + PDB monotone gives lower
# bound that pred should respect.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 500
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 50
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m_curr_v3/epoch_0499.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true
  frontier_path: "megaminx/data/frontier_states.pt"
  frontier_fraction: 0.25
  frontier_walk_depth_cap: 200.0
  bfs_d6_path: "megaminx/data/bfs_d6_train.pt"
  bfs_d6_fraction: 0.10
  lambda_pdb: 5.0

seed: 34
