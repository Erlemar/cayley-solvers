# m42 — Distributional V (32 quantiles, QR-DQN-style Bellman backup).
#
# Same recipe as m05_bellman_warm except:
#   - output_dim = 32 (quantiles instead of scalar V)
#   - loss = quantile_huber instead of MSE
#   - Bellman target uses target_model's quantile dist on chosen child + 1
#   - warmstart from m05 V (output_dim=1) by replicating across 32 quantile slots
#
# Hypothesis: predicting a distribution over plausible distances, plus selecting
# states by lower quantile at beam time, helps the search avoid "uncertain-far"
# states. Last orthogonal training-side bet given the cluster ceiling.
#
# Honest expectation: same prior as other recipe variants — high probability
# this also lands at 50/51 / mean ~89-99 strat-5 cluster.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 500
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 50
  n_back: 1
  amp: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m05_bellman_warm/epoch_0499.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true

distributional:
  n_quantiles: 32
  kappa: 1.0

seed: 42
