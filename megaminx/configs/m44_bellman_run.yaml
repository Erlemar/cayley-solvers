# m44 Bellman warmstart from m44 pretrain.
# Fill warmstart_path with the actual pretrain epoch_3999.pt path before launch.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [512, 128]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 500
  samples_per_epoch: 500_000
  batch_size: 16384
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 50
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m44/pretrain/epoch_3999.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true

seed: 44
