# Phase-2 V for the two-phase (Kociemba-style) solver.
# Solve WITHIN the subgroup H generated by the 6 TOP faces (12 generators).
# Restricted-generator random walks from solved; plain ResMLP V; walk-depth MSE.
# Exact V0/d1 anchors are mixed in every epoch so the solved state remains the
# value minimum. H ~ 2e42 states, branching ~8.7, estimated diameter ~45 (Vlad).
#
# Trainer: megaminx/scripts/110_train_phase2.py (builds the restricted puzzle).

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 2000
  samples_per_epoch: 1_000_000
  batch_size: 16384
  k_max: 48
  lr: 2.0e-3
  weight_decay: 0.0
  checkpoint_every_epochs: 100
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

anchors:
  n_v0: 6144
  n_d1_per_move: 512

seed: 0
