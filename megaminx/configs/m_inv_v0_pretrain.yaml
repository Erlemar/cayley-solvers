# m_inv_v0_pretrain — Stage 1a of representation-upgraded ResMLP.
#
# Same trunk as m_dd_v0 (2048,512)+2rb. Only change: encoding=state_inv,
# which exposes both state[i] (sticker in slot) and inv_state[i] (slot of
# sticker i) as parallel embedded channels. ~10M params (vs 6M baseline).
# The bigger parameter count is concentrated in the first Linear layer
# (input dim doubled), trunk shape unchanged → Rule 14 trunk-regression
# warning doesn't apply.
#
# Per Rule 18: input-dim change ⇒ can't warmstart from m_dd_v0 (the
# input_stack[0] tensor shape differs). Pretrain from scratch first, then
# Bellman warm from this checkpoint.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: state_inv
  embed_dim: 16

training:
  n_epochs: 50
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 25
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

seed: 42
