# m_fr_v1 — Frontier replay with frontier_fraction=0.5 (Idea 3 v2 / "B" in user's plan).
#
# Tests sensitivity of frontier mixin proportion. m_fr_v0 used 25% frontier;
# this one doubles to 50%.
#
# Hypothesis: 50% might over-bias body toward visited frontier states and lose
# generalization on non-frontier states. Or it might be even better. The
# answer is empirical.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 500
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 50
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m07_big_k80/epoch_3999.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true
  frontier_path: "megaminx/data/frontier_states.pt"
  frontier_fraction: 0.5
  frontier_walk_depth_cap: 200.0

seed: 31
