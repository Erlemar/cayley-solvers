# m36: deeper-but-narrower architecture experiment.
# 6 ResBlocks at width 512 vs m05's 2 ResBlocks at width 512.
# Roughly same param count (~5.6M vs m05's 6.0M).
# Tests arXiv:2602.03655 hypothesis: depth scales logarithmically with
# sequence length for sequential group composition. Our paths are
# 80-100 moves; log2(100) ≈ 7 layers needed. m05 has 2 ResBlocks
# (= 4 dense layers including residuals); m36 has 6 ResBlocks.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [1024, 512]
  num_res_blocks: 6
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 4000
  samples_per_epoch: 1_000_000
  batch_size: 16384
  k_max: 80
  lr: 2.0e-3
  weight_decay: 0.0
  checkpoint_every_epochs: 500
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

seed: 36
