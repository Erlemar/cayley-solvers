# m_curr_v2 = curriculum body (m_curr_v0) + Bellman + frontier replay (Option B).
#
# Same Bellman + frontier mixin recipe as m_fr_v0, but warmstarted from
# m_curr_v0/best_ema.pt (the curriculum-trained body that gave us strat-5
# chosen 85.41 — best V we've trained).
#
# Question this answers: does Bellman tightening on top of the curriculum
# body preserve the curriculum's beam-quality advantage, or does it pull
# the body back toward m07-style fixed-point?

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 500
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 50
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m_curr_v0/best_ema.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true
  frontier_path: "megaminx/data/frontier_states.pt"
  frontier_fraction: 0.25
  frontier_walk_depth_cap: 200.0

seed: 33
