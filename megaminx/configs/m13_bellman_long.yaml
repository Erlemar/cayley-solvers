# m13: Bellman refinement extended to 1000 epochs (m05 used 500). Same recipe otherwise.
# Hypothesis: m05 might still be improving at 500 ep; another 500 may push solve rate
# from 50/51 toward 51/51 and shorten paths further.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 1000
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 100
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m07_big_k80/epoch_3999.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true

seed: 130
