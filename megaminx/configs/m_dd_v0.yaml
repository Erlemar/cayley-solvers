# m_dd_v0 = dataset distillation. m_curr_v3 recipe + anchor mixin.
#
# Anchor mixin: every batch includes V0 (target=0) and 24 d=1 children (target=1)
# with exact labels. Addresses V(V0)≈2 bug where Bellman bootstrap at V0
# gives target = 1 + min_a V(d=1 child) ≈ 2 instead of the true 0.
#
# Plus combined PDB lower-bound penalty.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 500
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 50
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m_curr_v3/epoch_0499.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true
  frontier_path: "megaminx/data/frontier_states.pt"
  frontier_fraction: 0.25
  frontier_walk_depth_cap: 200.0
  bfs_d6_path: "megaminx/data/bfs_d6_train.pt"
  bfs_d6_fraction: 0.10
  lambda_pdb: 5.0
  n_anchor_v0: 32
  n_anchor_d1: 4

seed: 34
