# m28: Double Bellman warmstart from m05 (van Hasselt 2010 / Double DQN 2016).
#
# Hypothesis: m05/m17/m26/m27 cluster at strat-5 50-51 / mean 89-92 because
# `min_a V_target(child)` has an optimistic bias — any single child accidentally
# underestimated by V_target gets picked, and that error propagates inward via
# Bellman bootstrap. Maintaining TWO target nets and decorrelating selection
# from value estimation breaks the propagation cycle.
#
# Same arch as m05 (6M, [2048,512]x2, 2 ResBlocks). Pure recipe change.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 300
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 25
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m05_bellman_warm/epoch_0499.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true
  double_bellman: true

seed: 70
