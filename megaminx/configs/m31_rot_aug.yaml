# m31: m05 Bellman recipe + rotation augmentation (50% of batch).
#
# Hypothesis: the m05 cluster ceiling (51/51, mean 89-92 across all variants
# tested so far including Double Bellman, BFS-d6 mixin, n_back sweep, K-step,
# SWA) may partly be due to limited orbit-coverage of the random-walk training
# distribution. Each random walk visits a thin trajectory through state space;
# the icosahedral × C6 rotation group can multiply each visited state by 360
# orbit-equivalent representations with the SAME distance label.
#
# m29 (n_back=4) was the only variant to break the cluster (88.98 vs 89.4) —
# also a coverage-side change. By analogy, augmentation may give a similar or
# bigger gain. If it tests negative, the hypothesis (training data coverage is
# binding) is falsified and we pivot back to bias mitigation / beam-side levers.
#
# Same arch + recipe + warmstart as m05 — only augmentation is new.

model:
  state_size: 120
  num_classes: 120
  hidden_dims: [2048, 512]
  num_res_blocks: 2
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 300
  samples_per_epoch: 500_000
  batch_size: 8192
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 25
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

bellman:
  warmstart_path: "megaminx/models/m05_bellman_warm/epoch_0499.pt"
  target_update_every_epochs: 10
  target_net_chunk: 4096
  clip_upper: true
  clip_lower: true
  rotations_path: "megaminx/data/rotations.npy"
  rotation_aug_prob: 0.5

seed: 90
