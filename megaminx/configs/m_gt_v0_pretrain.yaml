# m_gt_v0_pretrain — Phase 2 smoke: GraphTransformer random-walk MSE pretrain.
# Targets: confirm forward works, loss decreases, no OOM, ckpt save/load round-trips.
# Wall budget: ~5-15 min on local 4090.

model:
  model_class: GraphTransformerV
  state_size: 120
  num_classes: 120
  d_model: 192
  n_layers: 3
  n_heads: 4
  ffn_dim: 768
  dropout: 0.0
  use_relation_bias: true
  use_dist_bias: true
  activation: gelu
  output_dim: 1
  inference_chunk_size: 4096

training:
  n_epochs: 50
  samples_per_epoch: 300_000
  batch_size: 2048
  k_max: 80
  lr: 5.0e-4
  weight_decay: 0.0
  checkpoint_every_epochs: 25
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

seed: 7200
