# Embedding-encoder variant — 4.5x smaller input (1152 vs 5184 dims) enables wider beams.
# Same [700, 643] x 4 blocks trunk, but input projection is nn.Embedding(72, 16).
model:
  state_size: 72
  num_classes: 72
  hidden_dims: [700, 643]
  num_res_blocks: 4
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 200
  samples_per_epoch: 1_000_000
  batch_size: 4096
  k_max: 30
  lr: 1.0e-3
  weight_decay: 0.0
  checkpoint_every_epochs: 20

seed: 0
