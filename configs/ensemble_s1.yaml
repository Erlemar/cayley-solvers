# Ensemble member #1: fast recipe, seed 1.
model:
  state_size: 72
  num_classes: 72
  hidden_dims: [700, 643]
  num_res_blocks: 4
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 500
  samples_per_epoch: 1_000_000
  batch_size: 16384
  k_max: 30
  lr: 2.0e-3
  weight_decay: 0.0
  checkpoint_every_epochs: 100
  n_back: 1
  loss: mse
  amp: true
  compile_model: true
  fused_optimizer: true

seed: 1
