# Medium config — first real training run on the 4090.
# ~4-5s/epoch, 200 epochs ≈ 16 min. 7.4M params.
model:
  state_size: 72
  num_classes: 72
  hidden_dims: [700, 643]
  num_res_blocks: 4

training:
  n_epochs: 200
  samples_per_epoch: 1_000_000
  batch_size: 4096
  k_max: 30
  lr: 1.0e-3
  weight_decay: 0.0
  checkpoint_every_epochs: 20

seed: 0
