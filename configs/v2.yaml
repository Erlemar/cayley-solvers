# v2: chat-recipe improvements on top of embed.
#   - n_back=40 non-backtracking walks
#   - L1 loss instead of MSE
#   - bigger first projection (5000 vs 700)
#   - AdamW with weight_decay=1e-5
#   - keep embedding encoder, keep [hd1, hd2, res_blocks] shape
model:
  state_size: 72
  num_classes: 72
  hidden_dims: [5000, 1000]
  num_res_blocks: 4
  encoding: embedding
  embed_dim: 16

training:
  n_epochs: 250
  samples_per_epoch: 1_000_000
  batch_size: 4096
  k_max: 30
  lr: 1.0e-3
  weight_decay: 1.0e-5
  checkpoint_every_epochs: 25
  n_back: 40
  loss: l1

seed: 0
